# Deploy on push to main: the CI gate first, then terraform apply via GitHub
# OIDC - no stored AWS keys anywhere. AWS_DEPLOY_ROLE_ARN is a repo *variable*
# holding the role ARN output by terraform/bootstrap.
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false # queue deploys, never run two at once

permissions:
  id-token: write # OIDC token for configure-aws-credentials
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT: pipeline-radar

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      # Without this the action fails with an opaque "Could not load credentials
      # from any providers" - the real cause is a bootstrap step that never ran.
      - name: Check deploy role is configured
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN repo variable is not set. Apply terraform/bootstrap, then: gh variable set AWS_DEPLOY_ROLE_ARN --body \"\$(terraform output -raw deploy_role_arn)\""
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve account id
        run: echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      # The task definition references an image tag, so the image has to exist
      # in ECR before apply runs. The ECR repo itself comes from the bootstrap
      # layer, which is applied once by hand.
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # Context is the repo root, not api/: the image needs the shared
      # workspace (@pipeline-radar/shared) that the service imports.
      - name: Build and push API image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${PROJECT}-api:${GITHUB_SHA}"
          docker build --platform linux/amd64 -f api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      # web.tf uploads dist/ to S3, so the build must happen before apply.
      - name: Build frontend
        run: |
          npm ci
          npm run build -w pipeline-radar

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${PROJECT}-tfstate-${ACCOUNT_ID}"

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -input=false -var="image_tag=${GITHUB_SHA}" -out=tfplan

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan

      # S3 objects change without the distribution knowing; CDK's
      # BucketDeployment did this implicitly.
      - name: Invalidate CloudFront
        working-directory: terraform
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$(terraform output -raw distribution_id)" \
            --paths '/*'

      - name: App URL
        working-directory: terraform
        run: echo "Deployed -> $(terraform output -raw app_url)" >> "$GITHUB_STEP_SUMMARY"
