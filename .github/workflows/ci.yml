# CI gate: runs on every PR, and is reused verbatim by deploy.yml
# (workflow_call) so main deploys through exactly the checks PRs see.
#
# npm workspaces: install is always a single `npm ci` at the repo root against
# the one root lockfile; per-package work then runs with `-w <workspace>`.
name: ci

on:
  pull_request:
  workflow_call:

jobs:
  shared:
    # The DOM-free logic both the web app and the API/agent import.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test -w @pipeline-radar/shared
      - run: npm run build -w @pipeline-radar/shared

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint -w pipeline-radar
      - run: npm test -w pipeline-radar
      # Vite aliases @pipeline-radar/shared to source, so no shared build first.
      - run: npm run build -w pipeline-radar # tsc -b && vite build

  api:
    runs-on: ubuntu-latest
    # The store tests run against a real DynamoDB Local rather than a mock:
    # what they prove is server-side atomicity of ADD under concurrency, which
    # a hand-written fake would simply assert into existence.
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      DDB_ENDPOINT: http://localhost:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # The api now imports @pipeline-radar/shared, and TypeScript resolves
      # those types through the package's exports map into shared/dist - not
      # through Jest's moduleNameMapper, which only redirects the runtime
      # require. Without this step every suite that touches shared fails with
      # "Cannot find module '@pipeline-radar/shared/net'". It passes locally
      # on a tree that happens to have a built dist lying around, which is
      # exactly why it has to be explicit here.
      - run: npm run build -w @pipeline-radar/shared
      - run: npm test -w pipeline-radar-api
      # Context is the repo root: the image needs the shared workspace.
      - name: docker build
        run: docker build -f api/Dockerfile -t pipeline-radar-api .

      # Building is not running. A broken image built cleanly here and then
      # died at container start with "Cannot find module 'express'" - npm
      # workspaces had left it in api/node_modules, which the Dockerfile did
      # not copy. It shipped through three green deploys because ECS rolled
      # each revision back into a healthy steady state on the old image.
      # Starting the container is the only check that would have caught it.
      - name: Smoke the image (it must run, not just build)
        run: |
          docker run -d --name api-smoke -p 3001:3001 pipeline-radar-api
          for _ in $(seq 1 20); do
            if curl -fsS -m 2 http://localhost:3001/healthz >/dev/null 2>&1; then
              echo "container healthy: $(curl -fsS http://localhost:3001/healthz)"
              docker rm -f api-smoke >/dev/null
              exit 0
            fi
            # Exit early if it has already crashed rather than waiting out the loop.
            if [ "$(docker inspect -f '{{.State.Running}}' api-smoke)" != "true" ]; then
              break
            fi
            sleep 1
          done
          echo "::error::container never served /healthz"
          docker logs api-smoke || true
          docker rm -f api-smoke >/dev/null || true
          exit 1

  terraform-validate:
    # Catches infra errors pre-merge. fmt + validate need no AWS credentials,
    # so this runs on fork PRs too. Build the frontend first because the app
    # layer expects pipeline-radar/dist to exist when it uploads the web bundle.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build frontend for bundle upload checks
        run: |
          npm ci
          npm run build -w pipeline-radar
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - name: Format check
        run: terraform fmt -check -recursive terraform
      - name: Validate app layer
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate bootstrap layer
        working-directory: terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate
