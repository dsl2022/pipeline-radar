# CI gate: runs on every PR, and is reused verbatim by deploy.yml
# (workflow_call) so main deploys through exactly the checks PRs see.
name: ci

on:
  pull_request:
  workflow_call:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline-radar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline-radar/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build # tsc -b && vite build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test
      - name: docker build (build only, no push)
        run: docker build -t pipeline-radar-api .

  terraform-validate:
    # Catches infra errors pre-merge. fmt + validate need no AWS credentials,
    # so this runs on fork PRs too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - name: Format check
        run: terraform fmt -check -recursive terraform
      - name: Validate app layer
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate bootstrap layer
        working-directory: terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate
